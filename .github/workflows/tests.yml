name: Test I-Hate-Pdf API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install smoke-test dependencies
        run: python -m pip install Flask Werkzeug pypdf reportlab pytest
      - name: Run tests
        run: pytest -q
